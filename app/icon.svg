<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBA08"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="22" fill="url(#shieldGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#shineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  
  <!-- Stylized Geometric 'S' Monogram derived from Shine typography -->
  <!-- TODO: Owner approval for simplified favicon mark -->
  <path d="M 68 28 
           C 68 28, 38 24, 34 36 
           C 30 46, 70 48, 66 64 
           C 62 76, 32 72, 32 72
           M 32 72
           L 32 64
           C 32 64, 58 67, 56 57
           C 54 48, 18 47, 24 33
           C 29 20, 68 20, 68 20
           Z" 
        fill="url(#shineGrad)"/>
  
  <!-- Tiny subtle sparkle crown -->
  <polygon points="50,11 52,15 56,17 52,19 50,23 48,19 44,17 48,15" fill="#FFBA08"/>
</svg>